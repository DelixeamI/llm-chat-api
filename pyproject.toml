[project]
name = "llm-chat-api"
version = "0.1.0"
description = "Production-oriented async LLM chat backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "openai",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette's own code uses a deprecated anyio alias; not fixable from this project
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
